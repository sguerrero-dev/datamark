<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DataMark</title>
<meta name="description" content="DataMark: analítica en tiempo real y automatización de marketing multicanal. Prototipo funcional, Ingeniería de Software CUC 2026-2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='18' height='18' rx='5' fill='%233B6FE0'/%3E%3Crect x='11' y='11' width='18' height='18' rx='5' fill='%234F8CFF' fill-opacity='.85'/%3E%3C/svg%3E">
<style>
/* Layout: barra superior 56px · menú lateral 240px · zona central · columna derecha 480px (solo en Inicio) */
:root{
  --bg:#0F0F10;--surface:#17171A;--surface-2:#222226;--surface-active:#26262B;--border:#2A2A2E;
  --text:#F2F2F2;--text-muted:#9A9AA2;--primary:#4F8CFF;--primary-600:#3B6FE0;
  --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
  --canal-correo:#4F8CFF;--canal-mensajeria:#22C55E;--canal-push:#F59E0B;--canal-redes:#A78BFA;--canal-otro:#9A9AA2;
  --radius-sm:10px;--radius-md:14px;--radius-lg:18px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.small{font-size:13px}
.xs{font-size:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

/* ---------- Botones e inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text);font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.btn.primary:hover{background:#4a7ef0}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#f05a5a}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--text-muted);font-weight:500}
.input,select.input,textarea.input{height:40px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);width:100%}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.input.err{border-color:var(--danger)}
.err-msg{color:#ff8a8a;font-size:12px;min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary-600)}

/* ---------- Tarjetas, chips, badges, tablas ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;min-width:0}
.card-title{font-size:20px;font-weight:600}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--success);background:rgba(34,197,94,.12)}
.badge.warn{color:var(--warning);background:rgba(245,158,11,.12)}
.badge.bad{color:#ff7a7a;background:rgba(239,68,68,.14)}
.badge.off{color:var(--text-muted);background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.table-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:500;padding:0 12px 10px;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:right}
.up{color:var(--success)}
.down{color:#ff7a7a}

/* ---------- Layout de la app ---------- */
.app{display:grid;grid-template-rows:56px 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;color:var(--text);flex:none}
.logo-mark{width:26px;height:26px;position:relative;flex:none}
.logo-mark i{position:absolute;width:16px;height:16px;border-radius:5px}
.logo-mark i:first-child{left:0;top:0;background:var(--primary-600)}
.logo-mark i:last-child{right:0;bottom:0;background:var(--primary);opacity:.85}
.search-btn{flex:0 1 480px;margin:0 auto;display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);text-align:left}
.search-btn span{flex:1}
kbd{font-family:var(--font);font-size:12px;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--text-muted)}
.top-actions{display:flex;align-items:center;gap:4px;flex:none;position:relative}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-active);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text)}
.avatar-btn{border:none;background:transparent;padding:3px;border-radius:50%}
.menu-toggle{display:none}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.app.collapsed .body{grid-template-columns:72px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:var(--bg)}
.side-role{font-size:12px;color:var(--text-muted);padding:4px 12px 8px;display:flex;justify-content:space-between;align-items:center}
.nav-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--radius-sm);color:var(--text-muted);text-decoration:none;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface-active);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--surface-active);color:var(--text);font-weight:700}
.side-spacer{flex:1}
.side-bottom{border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.app.collapsed .nav-item span,.app.collapsed .side-role span{display:none}
.app.collapsed .nav-item{justify-content:center;padding:0}
.collapse-btn svg{transition:transform .2s}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.main{overflow-y:auto;min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:768px){.main{padding-left:32px;padding-right:32px}}
.crumbs{font-size:13px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:500}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-title{font-size:24px;font-weight:700}
.page-sub{color:var(--text-muted);margin-top:4px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:24px}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* ---------- Inicio: tablero ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:24px;align-items:start}
@media (min-width:1500px){.dash{grid-template-columns:minmax(0,1fr) 480px}}
@media (max-width:1279px){.dash{grid-template-columns:minmax(0,1fr)}}
.kpi-label{font-size:15px;font-weight:500}
.kpi{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:4px}
.kpi-value{font-size:48px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.delta{font-size:15px;font-weight:500}
.chart-box{position:relative;height:280px;margin-top:20px;touch-action:pan-y}
.chart-box svg.area{width:100%;height:100%;display:block;overflow:visible}
.chart-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--bg);transform:translate(-50%,-50%);pointer-events:none}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px))}
.chart-tip b{display:block;font-size:13px}
.x-labels{position:relative;height:20px;margin-top:8px;font-size:12px;color:var(--text-muted)}
.x-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.x-labels span:first-child{transform:none}
.x-labels span.now{color:var(--success);transform:translateX(-100%)}
.chart-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chart-filters select{height:30px;border-radius:999px;padding:0 10px;background:transparent;border:1px solid var(--border);font-size:13px;color:var(--text-muted)}
.obj-list{display:flex;flex-direction:column;gap:18px}
.obj{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:center}
.obj-ic{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.obj-top{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;margin-bottom:8px}
.obj-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .2s}
.perf{display:flex;flex-direction:column;gap:18px}
.perf-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto 64px;gap:12px;align-items:center}
.perf-row b{font-weight:700}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--success);font-weight:600}
.live i{width:9px;height:9px;border-radius:50%;background:var(--success);animation:pulse 1.6s ease-in-out infinite}
.live.paused{color:var(--text-muted)}
.live.paused i{background:var(--text-muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:560px;overflow-y:auto;margin-right:-8px;padding-right:8px}
.feed li button{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:transparent;border:none;padding:10px 8px;margin:0 -8px;border-radius:var(--radius-sm);width:calc(100% + 16px)}
.feed li button:hover{background:var(--surface-2)}
.feed .f-ic{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.feed .f-txt{font-weight:600;font-size:14px}
.feed .f-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.feed .f-act{color:var(--primary)}
.feed li.new{animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pending-bar{width:100%;margin-bottom:10px}

/* ---------- Componentes varios ---------- */
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:clamp(22px,2.2vw,30px);overflow-wrap:anywhere;font-weight:700;letter-spacing:-.01em}
.stat .l{font-size:13px;color:var(--text-muted)}
.ic-box{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--surface-active);border:1px solid var(--border);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary-600);border-color:var(--primary-600)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:13px}
.arrow{color:var(--text-muted)}
.empty{text-align:center;padding:32px 16px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.svc:first-child{border-top:none;padding-top:0}
.plan{display:flex;flex-direction:column;gap:12px}
.plan .price{font-size:28px;font-weight:700}
.plan ul{margin:0;padding-left:18px;color:var(--text-muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.hint{font-size:13px;color:var(--text-muted);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px}

/* ---------- Modal, drawer, toasts, popovers ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.modal.wide{width:min(760px,100%)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-title{font-size:20px;font-weight:600}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:8px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--surface-2)}
.steps span.on{background:var(--primary)}
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:46;overflow-y:auto;padding:24px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.timeline li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;font-size:14px}
.timeline li .dot{margin-top:5px}
.toasts{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:80;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--success);font-size:14px;animation:fadein .2s}
.toast.bad{border-left-color:var(--danger)}
.toast .t-ic{color:var(--success)}
.toast.bad .t-ic{color:var(--danger)}
.toast b{display:block}
.pop{position:absolute;top:48px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);width:min(340px,calc(100vw - 32px));padding:8px;z-index:30;display:flex;flex-direction:column}
.pop .pi{padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;display:flex;gap:10px;align-items:flex-start;background:transparent;border:none;text-align:left;color:var(--text)}
.pop button.pi:hover{background:var(--surface-2)}
.pop .ph{padding:8px 12px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.palette{width:min(600px,100%);padding:0;gap:0;align-self:flex-start;margin-top:10vh}
.palette input{border:none;border-bottom:1px solid var(--border);border-radius:0;height:56px;background:transparent;padding:0 20px;font-size:16px}
.palette input:focus{box-shadow:none}
.pal-list{list-style:none;margin:0;padding:8px;max-height:50vh;overflow-y:auto}
.pal-list li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer}
.pal-list li[aria-selected="true"]{background:var(--surface-active)}
.pal-list .pk{margin-left:auto;font-size:12px;color:var(--text-muted)}

/* ---------- Acceso ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:var(--surface);border-right:1px solid var(--border);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-side h1{font-size:34px;line-height:1.15;max-width:18ch}
.auth-side p{color:var(--text-muted);max-width:46ch}
.auth-main{display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-form{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.demo-accs{display:flex;flex-direction:column;gap:8px}
.demo-acc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg);text-align:left}
.demo-acc:hover{border-color:var(--primary)}
.mini-feed{display:flex;flex-direction:column;gap:10px}
.mini-feed div{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--text-muted)}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-side{display:none}}

/* ---------- Responsivo ---------- */
@media (max-width:767px){
  .menu-toggle{display:inline-flex}
  .body,.app.collapsed .body{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(280px,85vw);z-index:60;transform:translateX(-105%);transition:transform .2s;padding-top:max(16px,env(safe-area-inset-top,0px))}
  .app.drawer-open .sidebar{transform:none}
  .app.collapsed .nav-item span,.app.collapsed .side-role span{display:inline}
  .app.collapsed .nav-item{justify-content:flex-start;padding:0 12px}
  .collapse-btn{display:none}
  .side-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .search-btn{flex:none;width:40px;padding:0;justify-content:center;margin-left:auto;margin-right:0}
  .search-btn span,.search-btn kbd{display:none}
  .top-actions .hide-sm{display:none}
  .logo span{display:none}
  .kpi-value{font-size:40px}
  .chart-box{height:220px}
  .card{padding:20px}

// Series de interacciones por canal: Hoy (24 h), 7 días, 30 días
function buildSeries() {
  const r = seeded(2026);
  const share = { correo: .337, mensajeria: .255, push: .204, redes: .204 };
  const hourShape = h => .25 + Math.max(0, Math.sin((h - 6) / 24 * Math.PI * 1.15)) * 1.2 + (h >= 12 && h <= 16 ? .3 : 0);
  const now = new Date();
  const hours = [...Array(24)].map((_, i) => (now.getHours() - 23 + i + 24) % 24);
  const weights = hours.map(h => hourShape(h) * (0.85 + r() * .3));
  const wsum = weights.reduce((a, b) => a + b, 0);
  const hoy = {}, d7 = {}, d30 = {};
  CHK.forEach(k => {
    hoy[k] = weights.map(w => Math.round(12480 * share[k] * w / wsum));
    d7[k] = [...Array(7)].map((_, i) => Math.round(12480 * share[k] * (0.82 + r() * .28) * (i === 6 ? 1 : 1)));
    d30[k] = [...Array(30)].map((_, i) => Math.round(12480 * share[k] * (0.7 + r() * .4) * (0.85 + i / 200)));
  });
  // Ajustar canales para que coincidan con la guía (4.210 · 3.180 · 2.540 · 2.550)
  const target = { correo: 4210, mensajeria: 3180, push: 2540, redes: 2550 };
  CHK.forEach(k => {
    const sum = hoy[k].reduce((a, b) => a + b, 0);
    hoy[k][23] += target[k] - sum;
    d7[k][6] = target[k]; d30[k][29] = target[k];
  });
  const days = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  return {
    hoy: { data: hoy, labels: hours.map(h => String(h).padStart(2, '0') + ':00'), tick: i => (hours[i] % 8 === 0 ? hours[i] : null) },
    d7: { data: d7, labels: [...Array(7)].map((_, i) => { const d = new Date(now - (6 - i) * 864e5); return days[d.getDay()] + ' ' + d.getDate(); }), tick: i => i },
    d30: { data: d30, labels: [...Array(30)].map((_, i) => { const d = new Date(now - (29 - i) * 864e5); return d.getDate() + ' ' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]; }), tick: i => (i % 7 === 0 ? i : null) }
  };
}

];
const EV_BAG = EVENT_TPL.flatMap(t => Array(t.w).fill(t));

function makeEvent(ts = Date.now()) {
  const t = pick(EV_BAG), c = pick(CONTACTS);
  // El motor de automatización evalúa las reglas activas sobre el evento
  const rule = t.trig ? S.rules.find(r => r.on && r.trig === t.trig) : null;
  let action = null;
  if (rule) {
    const integOk = !(rule.ch === 'mensajeria' && S.integ.find(i => i.id === 'wa')?.status !== 'ok');
    action = { rule: rule.name, ch: rule.ch, ok: integOk, txt: integOk ? `${CH[rule.ch].s.toLowerCase()} enviado` : `falló el envío por ${CH[rule.ch].s.toLowerCase()}` };
  }
  return {
    tipo: 'interaccion', tenant_id: 'emp_123', id: uid('ev'), canal: t.ch, objeto: t.obj, evento: t.ev,
    contacto_id: c.id, texto: t.txt(c.name), fuente: t.src || CH[t.ch].s, accion: action, ts
  };
}
function applyEvent(e, live = true) {
  if (e.canal) {
    ['hoy', 'd7', 'd30'].forEach(r => { const a = SERIES[r].data[e.canal]; a[a.length - 1]++; });
  }
  if (e.objeto) OBJECTS[e.objeto].v++;
  if (e.accion) {
    const rule = S.rules.find(r => r.name === e.accion.rule);
    if (rule && e.accion.ok) rule.runs++;
  }
  const c = contactById(e.contacto_id);
  c.inter++;
  c.hist.unshift({ txt: e.texto.replace(c.name, '').trim(), ch: e.canal, ts: e.ts, accion: e.accion });
  if (c.hist.length > 20) c.hist.pop();
  if (S.paused && live) { S.pending.unshift(e); }
  else { S.feed.unshift(e); if (S.feed.length > 50) S.feed.pop(); }
  dirty = true;
}

  let sel = 0, list = items;
  const draw = () => {
    $('#pal-list', m).innerHTML = list.length ? list.map((it, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}">${icon(it.ic)}<span>${esc(it.n)}</span><span class="pk">${it.k}</span></li>`).join('') : '<li class="muted">Sin resultados</li>';
  };
  const q = $('#pal-q', m);
  q.oninput = () => { const v = q.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); list = items.filter(it => it.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(v)); sel = 0; draw(); };
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && list[sel]) { closeModal(true); list[sel].go(); }
  };
  $('#pal-list', m).onclick = e => { const li = e.target.closest('[data-i]'); if (li) { closeModal(true); list[+li.dataset.i].go(); } };

}

    em.onblur = () => setErr(em, em.value && !/^\S+@\S+\.\S+$/.test(em.value) ? 'Escribe un correo válido.' : '');
    $$('[data-demo]').forEach(b => b.onclick = () => { em.value = DEMO[b.dataset.demo].email; pw.value = DEMO_PASS; setErr(em, ''); setErr(pw, ''); lf.requestSubmit(); });
    lf.onsubmit = e => {
      e.preventDefault();
      let bad = false;
      if (!/^\S+@\S+\.\S+$/.test(em.value)) { setErr(em, 'Escribe un correo válido.'); bad = true; } else setErr(em, '');
      if (!pw.value) { setErr(pw, 'Escribe tu contraseña.'); bad = true; } else setErr(pw, '');
      if (bad) return;
      const role = Object.keys(DEMO).find(k => DEMO[k].email === em.value.trim().toLowerCase());
      const reg = store.get('registered', []).find(x => x.email === em.value.trim().toLowerCase());
      if ((role && pw.value === DEMO_PASS) || (reg && reg.pass === pw.value)) {
        const d = role ? DEMO[role] : reg;
        login(role || 'empresa', d);
      } else {
        toast('No pudimos iniciar sesión', 'El correo o la contraseña no coinciden. Revisa e intenta de nuevo.', false);
        setErr(pw, 'Correo o contraseña incorrectos.');
      }
    };
  }
  const rf = $('#reg-form');
  if (rf) {
    rf.onsubmit = e => {
      e.preventDefault();
      const f = id => $('#' + id);
      const checks = [
        ['r-emp', v => v.trim().length >= 3 ? '' : 'Escribe el nombre de la empresa.'],
        ['r-nit', v => /^[\d.]{6,}-?\d?$/.test(v.trim()) ? '' : 'Escribe un NIT válido, por ejemplo 900.123.456-7.'],
        ['r-name', v => v.trim().length >= 3 ? '' : 'Escribe tu nombre.'],
        ['r-email', v => /^\S+@\S+\.\S+$/.test(v) ? '' : 'Escribe un correo válido.'],
        ['r-pass', v => v.length >= 8 ? '' : 'La contraseña debe tener al menos 8 caracteres.']
      ];
      let bad = false;
      checks.forEach(([id, fn]) => { const m = fn(f(id).value); setErr(f(id), m); if (m) bad = true; });
      $('#r-hd-err').textContent = f('r-hd').checked ? '' : 'Debes aceptar el tratamiento de datos para continuar.';
      if (!f('r-hd').checked) bad = true;
      if (bad) { toast('Revisa el formulario', 'Hay campos por completar.', false); return; }
      const name = f('r-name').value.trim();
      const d = { email: f('r-email').value.trim().toLowerCase(), pass: f('r-pass').value, name, ini: name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase(), empresa: f('r-emp').value.trim() };
      const regs = store.get('registered', []); regs.push(d); store.set('registered', regs);
      S.companies.push({ id: uid('emp'), name: d.empresa, nit: f('r-nit').value, plan: f('r-plan').value.split(' ·')[0], users: 1, status: 'ok', city: '—', since: 'nov 2026', events: 0 });
      S.company = { ...S.company, name: d.empresa, nit: f('r-nit').value, email: d.email };
      save('company');
      toast('Empresa registrada', `Bienvenido a DataMark, ${name.split(' ')[0]}.`);
      login('empresa', d, true);
    };
    $$('#reg-form .input').forEach(i => i.addEventListener('blur', () => { if (i.classList.contains('err')) rf.requestSubmit && null; }));
  }
}
function login(role, d, silent) {
  S.session = { role, name: d.name, ini: d.ini, email: d.email, empresa: d.empresa };
  store.set('session', S.session); // R1-4: credenciales/sesión persistentes (en la versión final: JWT)
  if (!silent) toast('Inicio de sesión exitoso', `Hola, ${d.name.split(' ')[0]}. Entraste como ${ROLES[role].n}.`);
  location.hash = ROLES[role].home; render();
}

const head = (t, sub, actions = '') => `<div class="page-head"><div><h1 class="page-title">${t}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div>${actions ? `<div class="row wrap">${actions}</div>` : ''}</div>`;
const statusBadge = (s, txt) => `<span class="badge ${s}">${txt}</span>`;

// ===== Inicio (Usuario Empresa / Analista) — RF13, RF14 =====
function seriesNow() {
  const sr = SERIES[S.range];
  const keys = S.chFilter === 'todos' ? CHK : [S.chFilter];
  const n = sr.labels.length;
  const vals = [...Array(n)].map((_, i) => keys.reduce((a, k) => a + sr.data[k][i], 0));
  return { vals, labels: sr.labels, tick: sr.tick };
}

          <button class="btn sm" id="pause-btn" aria-pressed="${S.paused}">${S.paused ? icon('play', 'sm') + 'Reanudar' : icon('pause', 'sm') + 'Pausar'}</button></div>

function drawChart() {
  const box = $('#chart'); if (!box) return;
  const { vals, labels, tick } = seriesNow();
  const n = vals.length, max = Math.max(...vals) * 1.15, W = 1000, H = 280;
  const x = i => i / (n - 1) * W, y = v => H - (v / max) * (H - 10);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  box.innerHTML = `<svg class="area" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(130,170,255,0.28)"/><stop offset="1" stop-color="rgba(130,170,255,0)"/></linearGradient></defs>
    <path d="M0,${H} L${pts.join(' L')} L${W},${H} Z" fill="url(#grad)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${S.chFilter === 'todos' ? '#CFE0FF' : CH[S.chFilter].c}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}" stroke="#3a3a40" stroke-dasharray="2 6" vector-effect="non-scaling-stroke"/>
  </svg><div class="chart-dot" id="c-dot" hidden></div><div class="chart-tip" id="c-tip" hidden></div>`;
  const xl = $('#x-labels');
  const ticks = [];
  for (let i = 0; i < n - 1; i++) { if (tick(i) !== null) ticks.push(i); }
  const maxTicks = box.clientWidth < 500 ? 3 : 6;
  const step = Math.ceil(ticks.length / maxTicks);
  xl.innerHTML = ticks.filter((_, j) => j % step === 0).filter(i => i < n - 3 || n < 8).map(i => `<span style="left:${i / (n - 1) * 100}%">${labels[i]}</span>`).join('') + `<span class="now" style="left:100%">${S.range === 'hoy' ? 'Ahora' : 'Hoy'}</span>`;
  const total = vals.reduce((a, b) => a + b, 0), peak = vals.indexOf(Math.max(...vals));
  $('#chart-sum').textContent = `Gráfica de interacciones, ${S.range === 'hoy' ? 'últimas 24 horas' : S.range === 'd7' ? 'últimos 7 días' : 'últimos 30 días'}: total ${fmt(total)}, pico de ${fmt(vals[peak])} en ${labels[peak]}.`;
  // Tooltip
  const show = clientX => {
    const r = box.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((clientX - r.left) / r.width * (n - 1))));
    const v = seriesNow().vals[i];
    const px = i / (n - 1) * r.width, py = y(v) / H * r.height;
    const dot = $('#c-dot'), tip = $('#c-tip');
    dot.hidden = tip.hidden = false;
    dot.style.left = px + 'px'; dot.style.top = py + 'px';
    tip.style.left = Math.min(Math.max(px, 70), r.width - 70) + 'px'; tip.style.top = py + 'px';
    tip.innerHTML = `<b class="num">${labels[i]} · ${fmt(v)} inter.</b><span class="muted">${S.chFilter === 'todos' ? 'Todos los canales' : CH[S.chFilter].n}</span>`;
  };
  box.onmousemove = e => show(e.clientX);
  box.ontouchstart = box.ontouchmove = e => show(e.touches[0].clientX);
  box.onmouseleave = () => { $('#c-dot').hidden = $('#c-tip').hidden = true; };
}
function drawKpi() {
  const { vals } = seriesNow();
  const total = vals.reduce((a, b) => a + b, 0);
  let prev = PREV[S.range];
  if (S.chFilter !== 'todos') prev = prev * ({ correo: .32, mensajeria: .26, push: .225, redes: .2 }[S.chFilter]);
  const d = (total - prev) / prev * 100;
  $('#kpi-v').textContent = fmt(total);
  $('#kpi-ch').textContent = S.chFilter === 'todos' ? 'Todos los canales' : CH[S.chFilter].n;
  const lbl = { hoy: 'frente a ayer', d7: 'frente a la semana anterior', d30: 'frente al mes anterior' }[S.range];
  $('#kpi-d').className = 'delta ' + (d >= 0 ? 'up' : 'down');
  $('#kpi-d').textContent = `${d >= 0 ? '▲ +' : '▼ −'}${fmt1(Math.abs(d))} % ${lbl}`;
}
function drawObjects() {
  const el = $('#obj-list'); if (!el) return;
  const objs = Object.values(OBJECTS).sort((a, b) => b.v - a.v).slice(0, 4);
  const max = objs[0].v * 1.1;
  el.innerHTML = objs.map(o => `<div class="obj"><span class="obj-ic">${chDot(o.ch)}</span><div style="min-width:0">

}
function drawPerf() {
  const el = $('#perf'); if (!el) return;
  el.innerHTML = CHK.map(k => {
    const v = SERIES.hoy.data[k].reduce((a, b) => a + b, 0), d = CH_DELTA[k];
    return `<div class="perf-row">${chDot(k)}<span>${CH[k].n}</span><b class="num">${fmt(v)}</b><span class="num ${d >= 0 ? 'up' : 'down'}" style="text-align:right">${d >= 0 ? '+' : '−'}${Math.abs(d)} %</span></div>`;
  }).join('');
}
function feedItem(e, isNew) {
  const ic = e.canal ? CH[e.canal].ic : (e.evento === 'carrito' ? 'cart' : e.evento === 'formulario' ? 'form' : 'pay');
  const act = e.accion ? ` <span class="${e.accion.ok ? 'f-act' : 'down'}">→ ${esc(e.accion.txt)}</span>` : '';
  return `<li class="${isNew ? 'new' : ''}"><button data-contact="${e.contacto_id}"><span class="f-ic" style="color:${e.canal ? CH[e.canal].c : 'var(--text-muted)'}">${icon(ic)}</span>

}
let lastFeedTop = null;
function drawFeed() {
  const el = $('#feed'); if (!el) return;
  const top = S.feed[0]?.id;
  el.innerHTML = S.feed.map(e => feedItem(e, lastFeedTop && e.id === top && top !== lastFeedTop)).join('');

function updateLive(changed) {
  if (changed) { drawKpi(); drawChartLight(); drawObjects(); drawPerf(); if (!S.paused) drawFeed(); else { const pb = $('#pending-btn'); if (pb) { pb.hidden = !S.pending.length; pb.textContent = `${S.pending.length} evento${S.pending.length === 1 ? '' : 's'} nuevo${S.pending.length === 1 ? '' : 's'} en pausa · Mostrar`; } } }

function drawChartLight() {
  // Actualiza solo la forma de la gráfica sin perder el tooltip
  const box = $('#chart'); if (!box) return;
  const svg = $('svg', box); if (!svg) return drawChart();
  const { vals } = seriesNow();
  const n = vals.length, max = Math.max(...vals) * 1.15, W = 1000, H = 280;
  const pts = vals.map((v, i) => `${(i / (n - 1) * W).toFixed(1)},${(H - (v / max) * (H - 10)).toFixed(1)}`);
  $('path', svg).setAttribute('d', `M0,${H} L${pts.join(' L')} L${W},${H} Z`);

function afterInicio() {
  drawKpi(); drawChart(); drawObjects(); drawPerf(); drawFeed();
  $$('[data-range]').forEach(b => b.onclick = () => { S.range = b.dataset.range; $$('[data-range]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawKpi(); drawChart(); });
  $('#ch-filter').onchange = e => { S.chFilter = e.target.value; drawKpi(); drawChart(); };
  $('#pause-btn').onclick = () => {
    S.paused = !S.paused;

    const li = $('#live-ind'); li.classList.toggle('paused', S.paused); $('span', li).textContent = S.paused ? 'En pausa' : 'En vivo';

  $('#pending-btn').onclick = () => $('#pause-btn').click();
  let rt; window.onresize = () => { clearTimeout(rt); rt = setTimeout(() => S.route === 'inicio' && drawChart(), 150); };
}

       <label class="check"><input type="checkbox" id="w-on" ${d.on ? 'checked' : ''}><span>Activarla al guardar</span></label>`
    ][step];
    const m = openModal(`${modalHead(edit ? 'Editar automatización' : 'Crear automatización', `Paso ${step + 1} de 3 · ${['Disparador', 'Acción', 'Revisar y guardar'][step]}`)}
      <div class="steps" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')}</div>

      if (step === 0) d.trig = $('input[name=trig]:checked', m).value;
      if (step === 1) { d.ch = $('#w-ch', m).value; d.tpl = $('#w-tpl', m).value.trim(); d.wait = $('#w-wait', m).value; }

    };

    $('#w-next', m).onclick = () => {

      if (step === 1 && !d.tpl) return setErr($('#w-tpl', m), 'Escribe el mensaje que recibirá el cliente.');
      if (step === 2 && !d.name) return setErr($('#w-name', m), 'Ponle un nombre para encontrarla fácil.');
      if (step < 2) { step++; return draw(); }
      if (edit) { Object.assign(S.rules.find(r => r.id === edit.id), d); toast('Automatización actualizada', d.name); }
      else { S.rules.unshift({ ...d, id: uid('r'), runs: 0 }); toast('Automatización creada', `${d.name} ${d.on ? 'ya está activa' : 'quedó en pausa'}.`); }
      save('rules'); closeModal(); if (S.route === 'automatizaciones') render(); else go('automatizaciones');
    };
  };
  draw();
}

// ===== Analítica por canal (RF13) =====
function channelMetrics() {
  const base = { correo: [2.4, .014, 6.9], mensajeria: [1.6, .021, 4.8], push: [3.1, .008, 3.1], redes: [4.2, .005, 3.6] };
  return CHK.map(k => {
    const inter = SERIES.d30.data[k].reduce((a, b) => a + b, 0);
    const [f, cr, rev] = base[k];
    const traf = Math.round(inter * f);
    return { k, traf, inter, conv: Math.round(traf * cr), cr, rev: rev * 1e6 };
  });
}
function viewAnalitica() {
  const m = channelMetrics();
  const maxCr = Math.max(...m.map(x => x.cr));
  return head('Analítica por canal', 'Tráfico, conversión y rendimiento de cada canal en los últimos 30 días.') +
    `<div class="grid g4" style="margin-bottom:24px">${m.map(x => `<div class="card stat"><span class="row" style="gap:8px">${chDot(x.k)}<span class="l">${CH[x.k].n}</span></span><span class="v num">${fmt1(x.cr * 100)} %</span><span class="l">conversión · ${fmt(x.conv)} ventas</span></div>`).join('')}</div>
    <div class="grid g2">
      <div class="card"><div class="card-head"><h2 class="card-title">Métricas por canal</h2><span class="muted xs">30 días</span></div>
        <div class="table-wrap"><table><thead><tr><th>Canal</th><th class="r">Tráfico</th><th class="r">Interacciones</th><th class="r">Conversiones</th><th class="r">Ingresos</th></tr></thead><tbody>
        ${m.map(x => `<tr><td><span class="row" style="gap:8px">${chDot(x.k)}${CH[x.k].s}</span></td><td class="r num">${fmt(x.traf)}</td><td class="r num">${fmt(x.inter)}</td><td class="r num">${fmt(x.conv)}</td><td class="r num">${money(x.rev)}</td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="card"><div class="card-head"><h2 class="card-title">Tasa de conversión</h2><span class="muted xs">ventas ÷ tráfico</span></div>
        <div class="obj-list">${m.slice().sort((a, b) => b.cr - a.cr).map(x => `<div><div class="obj-top"><span class="row" style="gap:8px">${chDot(x.k)}${CH[x.k].n}</span><span class="num">${fmt1(x.cr * 100)} %</span></div><div class="bar"><i style="width:${x.cr / maxCr * 100}%;background:${CH[x.k].c}"></i></div></div>`).join('')}</div>
        <p class="muted small" style="margin:20px 0 0">La mensajería convierte más aunque tiene menos tráfico: conviene usarla para el segmento VIP y los carritos abandonados.</p></div>
    </div>`;
}

    ${S.companies.map(c => `<tr><td><b>${esc(c.name)}</b><div class="muted xs">${c.id}</div></td><td class="num">${c.nit}</td><td>${c.city}</td><td>${c.plan}</td><td class="r num">${S.users.filter(u => u.emp === c.id).length}</td><td class="r num">${fmt(c.events)}</td><td>${companyBadge(c.status)}</td><td class="r"><button class="btn sm" data-users="${c.id}">Ver usuarios</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}
let userEmp = 'emp_123';
function afterEmpresas() { $$('[data-users]').forEach(b => b.onclick = () => { userEmp = b.dataset.users; go('usuarios'); }); }
function viewUsuarios() {
  return head('Usuarios y permisos', 'Consulta los usuarios de una empresa, cambia su rol o permisos, o elimínalos.') +
    `<div class="card"><div class="card-head"><div class="field" style="width:min(320px,100%)"><label for="u-emp">Empresa</label><select class="input" id="u-emp">${S.companies.map(c => `<option value="${c.id}" ${c.id === userEmp ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Permisos</th><th>Último acceso</th><th></th></tr></thead><tbody id="u-body"></tbody></table></div></div>`;
}
function afterUsuarios() {
  const draw = () => {
    const rows = S.users.filter(u => u.emp === userEmp);
    $('#u-body').innerHTML = rows.length ? rows.map(u => `<tr><td><div class="row"><span class="avatar">${u.name.split(' ').map(p => p[0]).join('')}</span><div><b>${esc(u.name)}</b><div class="muted xs">${esc(u.email)}</div></div></div></td>
      <td><label class="sr-only" for="role-${u.id}">Rol de ${esc(u.name)}</label><select class="input" id="role-${u.id}" data-role="${u.id}" style="height:34px;width:auto">${Object.keys(ROLE_PERMS).map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
      <td class="muted small">${u.perms.length} de ${PERMS.length}</td><td class="muted small">${u.last}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-perm="${u.id}">Permisos</button> <button class="icon-btn" data-udel="${u.id}" aria-label="Eliminar a ${esc(u.name)}" style="color:#ff7a7a">${icon('trash')}</button></td></tr>`).join('')
      : `<tr><td colspan="5"><div class="empty">Esta empresa no tiene usuarios.</div></td></tr>`;
    $$('[data-role]').forEach(s => s.onchange = () => { const u = S.users.find(x => x.id === s.dataset.role); u.role = s.value; u.perms = ROLE_PERMS[s.value].slice(); save('users'); toast('Rol actualizado', `${u.name} ahora es ${u.role}.`); draw(); });
    $$('[data-perm]').forEach(b => b.onclick = () => {
      const u = S.users.find(x => x.id === b.dataset.perm);
      const m = openModal(`${modalHead('Permisos de ' + esc(u.name), u.role)}<div class="stack" style="gap:12px">${PERMS.map((p, i) => `<label class="check"><input type="checkbox" value="${i}" ${u.perms.includes(i) ? 'checked' : ''}><span>${p}</span></label>`).join('')}</div>
        <div class="modal-actions"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="p-ok">Guardar permisos</button></div>`);
      $('#p-ok', m).onclick = () => { u.perms = $$('input:checked', m).map(i => +i.value); save('users'); closeModal(); toast('Permisos actualizados', u.name); draw(); };
    });
    $$('[data-udel]').forEach(b => b.onclick = () => {
      const u = S.users.find(x => x.id === b.dataset.udel);
      confirmModal({ title: '¿Eliminar este usuario?', text: `${esc(u.name)} perderá el acceso a DataMark. Esta acción no se puede deshacer.`, onOk: () => { S.users = S.users.filter(x => x !== u); save('users'); toast('Usuario eliminado', u.name); draw(); } });
    });
  };
  $('#u-emp').onchange = e => { userEmp = e.target.value; draw(); toast('Usuarios consultados', S.companies.find(c => c.id === userEmp).name); };
  draw();
}
function viewSuscripciones() {
  return head('Suscripciones y facturación', 'Planes disponibles y facturas de las empresas clientes. Valores en pesos colombianos.') +
    `<div class="grid g3" style="margin-bottom:24px">${PLANS.map(p => `<div class="card plan"><div class="row between"><b style="font-size:18px">${p.n}</b><span class="muted small">${S.companies.filter(c => c.plan === p.n).length} empresas</span></div><div class="price num">${money(p.p)}<span class="muted small" style="font-weight:400"> /mes</span></div><ul>${p.f.map(f => `<li>${f}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="card"><div class="card-head"><h2 class="card-title">Facturas</h2></div><div class="table-wrap"><table><thead><tr><th>Factura</th><th>Empresa</th><th>Plan</th><th class="r">Valor</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>
    ${INVOICES.map(([n, e, p, v, s, f]) => `<tr><td class="num">${n}</td><td>${e}</td><td>${p}</td><td class="r num">${money(v)}</td><td>${f}</td><td>${s === 'Pagada' ? statusBadge('ok', s) : s === 'Pendiente' ? statusBadge('warn', s) : statusBadge('bad', s)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
let monQueue = 12, monEpm = 412;
function viewMonitoreo() {
  return head('Monitoreo', 'Salud de los servicios del backend. Se actualiza cada segundo.') +
    `<div class="grid g4" style="margin-bottom:24px">
      <div class="card stat"><span class="l">Eventos por minuto</span><span class="v num" id="m-epm">${fmt(monEpm)}</span></div>
      <div class="card stat"><span class="l">En cola de eventos</span><span class="v num" id="m-q">${monQueue}</span></div>
      <div class="card stat"><span class="l">Usuarios conectados</span><span class="v num" id="m-u">138</span><span class="l">capacidad probada: 500</span></div>
      <div class="card stat"><span class="l">Último respaldo</span><span class="v" style="font-size:22px">Hoy 02:00</span><span class="l up">Completado</span></div></div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Servicio</th><th class="r">Latencia</th><th class="r">Disponibilidad 30 d</th><th>Estado</th></tr></thead><tbody>
    ${SERVICES.map((s, i) => `<tr><td><div class="row"><span class="ic-box">${icon('server', 'sm')}</span><div><b>${s.n}</b>${s.note ? `<div class="xs" style="color:var(--warning)">${s.note}</div>` : ''}</div></div></td><td class="r num" id="lat-${i}">${s.lat} ms</td><td class="r num">${fmt1(s.up)} %</td><td>${s.st === 'ok' ? statusBadge('ok', 'Operativo') : statusBadge('warn', 'Degradado')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function updateMonitor() {
  monEpm = Math.max(300, monEpm + Math.round((Math.random() - .5) * 40));
  monQueue = Math.max(0, monQueue + Math.round((Math.random() - .5) * 6));
  const e = $('#m-epm'); if (!e) return;
  e.textContent = fmt(monEpm); $('#m-q').textContent = monQueue;
  $('#m-u').textContent = 130 + Math.round(Math.random() * 16);
  SERVICES.forEach((s, i) => { const el = $('#lat-' + i); if (el) el.textContent = Math.max(4, Math.round(s.lat * (0.85 + Math.random() * .3))) + ' ms'; });
}

// ===== Configuración =====
function viewConfiguracion() {
  const c = S.company, u = S.session;
  return head('Configuración', 'Datos de tu cuenta' + (u.role === 'admin' ? '.' : ' y de tu empresa.')) +
    `<div class="grid g2" style="align-items:start">
    ${u.role !== 'admin' ? `<form class="card stack" id="cfg-form" style="gap:16px" novalidate><h2 class="card-title">Datos de la empresa</h2>
      <div class="field"><label for="cf-n">Razón social</label><input class="input" id="cf-n" value="${esc(c.name)}" ${u.role === 'analista' ? 'disabled' : ''}><span class="err-msg"></span></div>
      <div class="field"><label for="cf-nit">NIT</label><input class="input" id="cf-nit" value="${esc(c.nit)}" ${u.role === 'analista' ? 'disabled' : ''}></div>
      <div class="field"><label for="cf-city">Ciudad</label><input class="input" id="cf-city" value="${esc(c.city)}" ${u.role === 'analista' ? 'disabled' : ''}></div>
      <div class="field"><label for="cf-mail">Correo de contacto</label><input class="input" id="cf-mail" type="email" value="${esc(c.email)}" ${u.role === 'analista' ? 'disabled' : ''}><span class="err-msg"></span></div>
      ${u.role === 'analista' ? '<p class="hint" style="margin:0">Solo el Usuario Empresa puede cambiar estos datos.</p>' : '<button class="btn primary" type="submit">Guardar cambios</button>'}</form>` : ''}
    <div class="card stack" style="gap:16px"><h2 class="card-title">Tu cuenta</h2>
      <div class="row"><span class="avatar" style="width:48px;height:48px;font-size:16px">${esc(u.ini)}</span><div><b>${esc(u.name)}</b><div class="muted small">${esc(u.email)} · ${ROLES[u.role].n}</div></div></div>
      <div class="hint">${icon('shield', 'sm')} Sesión protegida con token JWT. Tus datos se tratan según la Ley 1581 de 2012.</div>
      <div class="row wrap"><button class="btn" id="reset-demo">Restablecer datos de demostración</button><button class="btn" id="cfg-logout">${icon('logout', 'sm')}Cerrar sesión</button></div>
    </div></div>`;
}
function afterConfiguracion() {
  const f = $('#cfg-form');
  if (f) f.onsubmit = e => {
    e.preventDefault();
    const n = $('#cf-n'), m = $('#cf-mail');
    setErr(n, n.value.trim() ? '' : 'Escribe la razón social.');
    setErr(m, /^\S+@\S+\.\S+$/.test(m.value) ? '' : 'Escribe un correo válido.');
    if (!n.value.trim() || !/^\S+@\S+\.\S+$/.test(m.value)) return toast('No se guardaron los cambios', 'Revisa los campos marcados.', false);
    S.company = { ...S.company, name: n.value.trim(), nit: $('#cf-nit').value, city: $('#cf-city').value, email: m.value };
    S.session.empresa = S.company.name; store.set('session', S.session);
    save('company'); toast('Datos guardados', 'La información de la empresa quedó actualizada.'); render();
  };
  $('#cfg-logout').onclick = logout;
  $('#reset-demo').onclick = () => confirmModal({ title: '¿Restablecer la demostración?', text: 'Se borran las reglas, canales, usuarios y segmentos que cambiaste y vuelven los datos de ejemplo.', ok: 'Restablecer', onOk: () => {
    ['rules', 'integ', 'users', 'segments', 'company', 'registered'].forEach(store.del);
    S.rules = structuredClone(DEFAULT_RULES); S.integ = structuredClone(DEFAULT_INTEGRATIONS); S.users = structuredClone(DEFAULT_USERS); S.segments = structuredClone(DEFAULT_SEGMENTS);
    toast('Demostración restablecida'); render();
  } });
}

const VIEWS = { inicio: viewInicio, canales: viewCanales, automatizaciones: viewAutomatizaciones, contactos: viewContactos, reportes: viewReportes, analitica: viewAnalitica, segmentacion: viewSegmentacion, exportar: viewExportar, campanas: viewCampanas, admin: viewAdmin, empresas: viewEmpresas, usuarios: viewUsuarios, suscripciones: viewSuscripciones, monitoreo: viewMonitoreo, configuracion: viewConfiguracion };
const AFTER = { inicio: afterInicio, canales: afterCanales, automatizaciones: afterAutomatizaciones, contactos: afterContactos, reportes: afterReportes, segmentacion: afterSegmentacion, exportar: afterExportar, empresas: afterEmpresas, usuarios: afterUsuarios, configuracion: afterConfiguracion };

// ---------- Eventos globales ----------
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]')) { closeModal(); return; }
  if (t.closest('[data-close-drawer]')) { closeDrawer(); return; }
  const ct = t.closest('[data-contact]'); if (ct) { openContact(ct.dataset.contact); return; }
  const app = $('#app');
  if (!app) return;
  const pop = $('#pop');
  if (t.closest('#search-btn')) { openPalette(); return; }
  if (t.closest('#menu-toggle')) { app.classList.add('drawer-open'); $('#side-scrim').hidden = false; return; }
  if (t.closest('#side-scrim') || (t.closest('.nav-item') && app.classList.contains('drawer-open'))) { app.classList.remove('drawer-open'); $('#side-scrim').hidden = true; }
  if (t.closest('#collapse-btn')) { S.collapsed = !S.collapsed; store.set('collapsed', S.collapsed); app.classList.toggle('collapsed', S.collapsed); S.route === 'inicio' && setTimeout(drawChart, 50); return; }
  if (t.closest('#notif-btn')) {
    if (!pop.hidden && pop.dataset.kind === 'n') { pop.hidden = true; return; }
    S.notifSeen = true; $('#notif-pip').hidden = true;
    pop.dataset.kind = 'n';
    pop.innerHTML = `<div class="ph">Notificaciones</div>${S.notifs.slice(0, 6).map(n => `<div class="pi"><span style="color:${n.bad ? 'var(--danger)' : 'var(--success)'}">${icon(n.bad ? 'alert' : 'check', 'sm')}</span><div><b style="font-size:14px">${esc(n.t)}</b><div class="muted xs">${esc(n.d)} · ${ago(n.ts)}</div></div></div>`).join('')}`;
    pop.hidden = false; return;
  }
  if (t.closest('#avatar-btn')) {
    if (!pop.hidden && pop.dataset.kind === 'a') { pop.hidden = true; return; }
    pop.dataset.kind = 'a';
    const u = S.session;
    pop.innerHTML = `<div class="pi"><span class="avatar">${esc(u.ini)}</span><div><b>${esc(u.name)}</b><div class="muted xs">${esc(u.email)}</div><div class="muted xs">${ROLES[u.role].n}</div></div></div>
      <button class="pi" onclick="go('configuracion')">${icon('sliders', 'sm')}Configuración</button><button class="pi" id="pop-logout">${icon('logout', 'sm')}Cerrar sesión</button>`;
    $('#pop-logout').onclick = logout;
    pop.hidden = false; return;
  }
  if (t.closest('#help-btn')) {
    openModal(`${modalHead('Ayuda rápida')}<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--text-muted)">
      <li><b style="color:var(--text)">Ctrl+K</b> abre el buscador para ir a cualquier pantalla o contacto.</li>
      <li>En <b style="color:var(--text)">Inicio</b>, haz clic en un evento de «Actividad en vivo» para ver el perfil del contacto.</li>
      <li>Puedes <b style="color:var(--text)">pausar</b> el feed; los eventos nuevos quedan en espera.</li>
      <li>Los avisos de éxito o fallo aparecen siempre arriba a la derecha.</li></ul><div class="modal-actions"><button class="btn primary" data-close>Entendido</button></div>`);
    return;
  }
  if (pop && !pop.hidden && !t.closest('#pop')) pop.hidden = true;
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') { if ($('#overlay')) closeModal(); else if ($('#drawer')) closeDrawer(); else { const p = $('#pop'); if (p) p.hidden = true; } }
  if (e.key === 'Enter' && e.target.matches('tr[data-contact]')) openContact(e.target.dataset.contact);
});

render();
</script>
</body>
</html>
